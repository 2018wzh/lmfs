[package]
name = "bpe-rs"
version = "0.1.0"
edition = "2024"


[lib]
name = "bpe_rs"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
aho-corasick = "1.1.5"
numpy = "0.29.0"
npyz = "0.9.1"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
